# endod-health.com on a server whose ports 80/443 belong to an existing
# nginx container. This file is copied into that container's conf.d by
# sync.sh; it only answers for Endod's host names.
#
# Cloudflare sits in front (proxied DNS) and terminates HTTPS for visitors.
# Port 80 serves Cloudflare's "Flexible" mode; 443 with Endod's own
# certificate serves "Full".

# Each app is resolved per request (Docker DNS), so this file loads even
# while one of them is stopped.
map $host $endod_upstream {
    default http://endod-frontend:3000;
    hospital.endod-health.com http://endod-hospital-portal:3000;
    meet.endod-health.com http://endod-meet:80;
    pharmacy.endod-health.com http://endod-pharmacy:3000;
    admin.endod-health.com http://endod-admin:3000;
    organisation.endod-health.com http://endod-organisation:3000;
}

# The visitor's address for the apps that rate-limit on it (the pharmacy
# site trusts only X-Endod-Client-IP): Cloudflare's header only when the
# connection really comes from Cloudflare, else the TCP peer, which a client
# cannot forge. Ranges: https://www.cloudflare.com/ips/ (keep in sync).
geo $remote_addr $endod_from_cloudflare {
    default 0;
    173.245.48.0/20 1;  103.21.244.0/22 1; 103.22.200.0/22 1; 103.31.4.0/22 1;
    141.101.64.0/18 1;  108.162.192.0/18 1; 190.93.240.0/20 1; 188.114.96.0/20 1;
    197.234.240.0/22 1; 198.41.128.0/17 1; 162.158.0.0/15 1;  104.16.0.0/13 1;
    104.24.0.0/14 1;    172.64.0.0/13 1;   131.0.72.0/22 1;
    2400:cb00::/32 1; 2606:4700::/32 1; 2803:f800::/32 1; 2405:b500::/32 1;
    2405:8100::/32 1; 2a06:98c0::/29 1; 2c0f:f248::/32 1;
}
map $endod_from_cloudflare $endod_client_ip {
    1       $http_cf_connecting_ip;
    default $remote_addr;
}

# Video calls keep WebSockets open (Jitsi's signalling and media control).
map $http_upgrade $endod_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name endod-health.com www.endod-health.com hospital.endod-health.com meet.endod-health.com pharmacy.endod-health.com admin.endod-health.com organisation.endod-health.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /etc/nginx/endod/proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name endod-health.com www.endod-health.com hospital.endod-health.com meet.endod-health.com pharmacy.endod-health.com admin.endod-health.com organisation.endod-health.com;

    ssl_certificate /etc/nginx/endod/origin.crt;
    ssl_certificate_key /etc/nginx/endod/origin.key;

    location / {
        include /etc/nginx/endod/proxy.conf;
    }
}
