# Proxy settings for Endod's web app (included by endod.conf).
resolver 127.0.0.11 valid=30s ipv6=off;
proxy_pass $endod_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Cloudflare appends the visitor's address; nginx then appends Cloudflare's.
# The web app reads the visitor two entries from the right (TRUSTED_PROXY_HOPS=2).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
client_max_body_size 16m;
proxy_read_timeout 60s;
