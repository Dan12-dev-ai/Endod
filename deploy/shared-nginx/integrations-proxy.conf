# Headers for the integration APIs (included by endod.conf, api.endod-health.com).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# The only client address the integration services trust (endod.conf).
proxy_set_header X-Endod-Client-IP $endod_client_ip;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Proto https;
# Proves the request came through this nginx (see sync.sh); never in git.
include /etc/nginx/endod/edge-key.conf;
proxy_read_timeout 60s;
