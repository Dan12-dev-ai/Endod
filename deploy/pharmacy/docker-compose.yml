# pharmacy.endod-health.com: the pharmacy site (github.com/Habtamu-Semagn/pharmacy_scanner).
#
# The site's code is checked out at /opt/endod-pharmacy/app. It talks to the
# platform only through the platform's internal API on endod-bus, with
# PHARMACY_API_KEY; the shared nginx reaches it on the edge network as
# endod-pharmacy:3000 and sets X-Endod-Client-IP (see shared-nginx/endod.conf).
#
#   cd /opt/endod/deploy/pharmacy && docker compose --env-file ../.env up -d --build
name: endod-pharmacy

services:
  site:
    build:
      context: /opt/endod-pharmacy/app
    restart: unless-stopped
    environment:
      PLATFORM_API_URL: http://endod-platform-api:8000
      PHARMACY_API_KEY: ${PHARMACY_API_KEY:?set PHARMACY_API_KEY in the platform .env}
      # https: production rules (the client IP must come from nginx).
      SITE_ORIGIN: https://pharmacy.endod-health.com
    networks:
      # The platform's internal API (endod-bus has no internet access).
      bus: {}
      edge:
        aliases: [endod-pharmacy]

networks:
  bus:
    external: true
    name: endod-bus
  edge:
    external: true
    name: ${SHARED_NGINX_NETWORK:-eyita_edge}
