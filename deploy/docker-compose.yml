# Endod Health: Postgres, the API, the patient web app, the event bus (Redis
# with Sentinel) and its worker, and a Cloudflare Tunnel.
#
# Nothing is published on the host: the only way in is the tunnel, which
# reaches the web app, and the web app reaches the API on the private
# network. See deploy/README.md.
#
#   cd deploy && docker compose -f docker-compose.yml -f shared-nginx/docker-compose.override.yml --env-file .env up -d --build

name: endod

# The master key that encrypts health data (README.md, "Encryption of health
# data"): a file on the host, outside the repository's tracked files and never
# in the database or its backups. Mounted read-only into the three services
# that read or write health data (backend, internal-api, events-worker), and
# nowhere else. If the file is missing, Compose refuses to start them rather
# than create an empty directory in its place.
x-master-key: &master-key
  type: bind
  source: /opt/endod/deploy/keys/master.key
  target: /run/secrets/platform_master_key
  read_only: true
  bind:
    create_host_path: false

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: endod
      POSTGRES_USER: endod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endod -d endod"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend-v2/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DEDAN_DATABASE_URL: postgresql+psycopg://endod:${POSTGRES_PASSWORD}@postgres:5432/endod
      # Reached by the web app only (as "backend"). Never on endod-bus: the
      # hospital service talks to internal-api instead.
      ALLOWED_HOSTS: backend,localhost,127.0.0.1
      # The platform's copies of hospital record files (a volume).
      RECORD_FILES_DIR: /data/records
      # The web app forwards the patient's address; per-patient rate limits.
      TRUST_PROXY_HEADERS: "true"
      # General API limit per address. Opening the dashboard alone makes about
      # eight calls, and mobile carriers put many people behind one address;
      # sign-in and SMS codes keep their own, much stricter limits.
      RATE_LIMIT_REQUESTS: "240"
      DEBUG: "false"
      # Signs the prescription QR codes History shows (docs/pharmacy.md).
      RX_SIGNING_KEY: ${RX_SIGNING_KEY:-}
      # The pharmacy API is internal-api's only: the patient API never holds its key.
      PHARMACY_API_KEY: ""
      PLATFORM_MASTER_KEY_FILE: /run/secrets/platform_master_key
      # Names its database connections (tools decrypt-existing waits for none).
      DEDAN_DB_APPLICATION_NAME: endod-backend
    volumes:
      - records:/data/records
      - *master-key
    depends_on:
      postgres:
        condition: service_healthy

  # The platform's internal API (backend-v2/main_internal.py): /internal/...
  # (X-Platform-Key), /pharmacy/... (X-Pharmacy-Key, docs/pharmacy.md) and
  # /health, nothing else. The only platform service on endod-bus, where the
  # hospital service fetches shared record files from it and the pharmacy
  # site looks up and dispenses prescriptions, as "endod-platform-api"; the
  # patient API is not reachable from there.
  internal-api:
    build:
      context: ..
      dockerfile: backend-v2/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "main_internal:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DEDAN_DATABASE_URL: postgresql+psycopg://endod:${POSTGRES_PASSWORD}@postgres:5432/endod
      INTERNAL_ALLOWED_HOSTS: endod-platform-api,localhost,127.0.0.1
      # Nothing in front of it: a client's forwarded address is never believed.
      TRUST_PROXY_HEADERS: "false"
      RECORD_FILES_DIR: /data/records
      # Required on /pharmacy (shared with the pharmacy site's server; unset:
      # refused), and the key that checks the prescription QR tokens.
      PHARMACY_API_KEY: ${PHARMACY_API_KEY:-}
      RX_SIGNING_KEY: ${RX_SIGNING_KEY:-}
      # Decrypts prescriptions for pharmacies and shared files for hospitals.
      PLATFORM_MASTER_KEY_FILE: /run/secrets/platform_master_key
      DEDAN_DB_APPLICATION_NAME: endod-internal-api
    volumes:
      # Serves files only; the events worker writes them.
      - records:/data/records:ro
      - *master-key
    networks:
      # The database, on the project's own network.
      default: {}
      # An address from the dynamic range (no fixed IP: only Redis and the
      # Sentinels have those).
      bus:
        aliases: [endod-platform-api]
    depends_on:
      postgres:
        condition: service_healthy
      # The backend creates the tables.
      backend:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      DEDAN_API_URL: http://backend:8000
      # Cloudflare appends the client address it saw: one hop from the right.
      TRUSTED_PROXY_HOPS: "1"
    depends_on:
      backend:
        condition: service_healthy

  # --- Events between Endod and the hospital service (Redis Streams) ---------
  # A master, a replica and three Sentinels that elect a new master if it
  # fails. Only on the private "bus" network, which the hospital service's
  # own Compose project joins (see Hospital-service/deploy).
  redis-1:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Starts as master or replica, whichever the Sentinels say (redis/redis.sh).
    entrypoint: ["sh", "/redis.sh"]
    environment:
      MY_IP: 172.30.77.11
      DEFAULT_MASTER_IP: 172.30.77.11
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
    volumes:
      - ./redis/redis.sh:/redis.sh:ro
      - redis1:/data
    networks:
      bus:
        ipv4_address: 172.30.77.11
        aliases: [endod-redis-1]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-2:
    image: redis:7.4-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/redis.sh"]
    environment:
      MY_IP: 172.30.77.12
      DEFAULT_MASTER_IP: 172.30.77.11
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
    volumes:
      - ./redis/redis.sh:/redis.sh:ro
      - redis2:/data
    networks:
      bus:
        ipv4_address: 172.30.77.12
        aliases: [endod-redis-2]

  sentinel-1: &sentinel
    image: redis:7.4-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/sentinel.sh"]
    environment: &sentinel-env
      SENTINEL_IP: 172.30.77.21
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
    volumes:
      - ./redis/sentinel.sh:/sentinel.sh:ro
      - sentinel1:/data
    networks:
      bus:
        ipv4_address: 172.30.77.21
        aliases: [endod-sentinel-1]

  sentinel-2:
    <<: *sentinel
    environment:
      <<: *sentinel-env
      SENTINEL_IP: 172.30.77.22
    volumes:
      - ./redis/sentinel.sh:/sentinel.sh:ro
      - sentinel2:/data
    networks:
      bus:
        ipv4_address: 172.30.77.22
        aliases: [endod-sentinel-2]

  sentinel-3:
    <<: *sentinel
    environment:
      <<: *sentinel-env
      SENTINEL_IP: 172.30.77.23
    volumes:
      - ./redis/sentinel.sh:/sentinel.sh:ro
      - sentinel3:/data
    networks:
      bus:
        ipv4_address: 172.30.77.23
        aliases: [endod-sentinel-3]

  # Sends Endod's events to the hospital service and applies its replies
  # (listings, decisions on bookings, refunds, links, records, follow-ups,
  # queues); ends unpaid booking holds, re-checks booking payments with Chapa
  # and sends refunds to it (docs/payments.md); downloads hospital record files from
  # the hospital API (endod-hospital-api on endod-bus); ends expired shares.
  events-worker:
    build:
      context: ..
      dockerfile: backend-v2/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "dedan_platform.events_worker"]
    env_file: .env
    environment:
      DEDAN_DATABASE_URL: postgresql+psycopg://endod:${POSTGRES_PASSWORD}@postgres:5432/endod
      REDIS_SENTINELS: endod-sentinel-1:26379,endod-sentinel-2:26379,endod-sentinel-3:26379
      REDIS_SENTINEL_MASTER: endod
      REDIS_MIN_REPLICAS: "1"
      # Downloads hospital record files here; the API serves them from the same volume.
      RECORD_FILES_DIR: /data/records
      # Issues prescription codes but never signs or checks a QR, nor serves
      # pharmacies: neither key is needed here.
      PHARMACY_API_KEY: ""
      RX_SIGNING_KEY: ""
      # Encrypts the records, files and follow-ups hospitals send.
      PLATFORM_MASTER_KEY_FILE: /run/secrets/platform_master_key
      DEDAN_DB_APPLICATION_NAME: endod-events-worker
    volumes:
      - records:/data/records
      - *master-key
    healthcheck:
      disable: true
    networks:
      default: {}
      bus: {}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      sentinel-1:
        condition: service_started

  # Only with the tunnel: `docker compose --profile tunnel up -d`.
  # (Alternatively an existing nginx fronts the app: see shared-nginx/.)
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  pgdata:
  # Hospital record files (PDF and images), shared by the API and the events worker.
  records:
  redis1:
  redis2:
  sentinel1:
  sentinel2:
  sentinel3:

networks:
  # Shared with the hospital service's Compose project (by this name). No
  # internet access from it; each service keeps its own network for that.
  # Redis and the Sentinels have fixed addresses: a stopped container's name
  # disappears from Docker's DNS, and Sentinels that cannot resolve the
  # failed master never elect a new one. Other containers get addresses from
  # the upper half.
  bus:
    name: endod-bus
    internal: true
    ipam:
      config:
        - subnet: 172.30.77.0/24
          ip_range: 172.30.77.128/25
