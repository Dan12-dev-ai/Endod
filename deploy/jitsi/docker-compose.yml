# Endod's own video server (Jitsi Meet) at meet.endod-health.com.
#
# Only people with a token from Endod can join: the patient app and the
# hospital portal sign one (JWT, HS256, JITSI_APP_SECRET) for each visit, for
# that visit's room only, and only around its time. Doctors join as
# moderators. Calls stay inside Endod's pages (the Jitsi page is embedded).
#
# The web part is reached through the server's shared nginx (alias
# endod-meet on its network); audio and video go straight to the server on
# UDP 10000, which must be open in the firewall.
#
#   cd deploy/jitsi && docker compose --env-file .env up -d

name: endod-meet

services:
  web:
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable-11031}
    restart: unless-stopped
    environment: &common
      PUBLIC_URL: https://meet.endod-health.com
      TZ: Africa/Addis_Ababa
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      ENABLE_GUESTS: "0"
      JWT_APP_ID: ${JWT_APP_ID:-endod}
      JWT_APP_SECRET: ${JWT_APP_SECRET:?set JWT_APP_SECRET (same as Endod's JITSI_APP_SECRET)}
      JWT_ACCEPTED_ISSUERS: ${JWT_APP_ID:-endod}
      JWT_ACCEPTED_AUDIENCES: jitsi
      # Moderators come from the token (doctors), not from joining first.
      ENABLE_AUTO_OWNER: "0"
      XMPP_MUC_MODULES: token_affiliation
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:?set JICOFO_AUTH_PASSWORD}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?set JVB_AUTH_PASSWORD}
      # TLS ends at Cloudflare and the shared nginx.
      DISABLE_HTTPS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_COLIBRI_WEBSOCKET: "1"
      ENABLE_PREJOIN_PAGE: "1"
      ENABLE_WELCOME_PAGE: "0"
      ENABLE_CLOSE_PAGE: "0"
      DEFAULT_LANGUAGE: en
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS:?set JVB_ADVERTISE_IPS (the server's public address)}
    volumes:
      - web-config:/config
    networks:
      meet:
        aliases: [meet.jitsi]
      shared_edge:
        aliases: [endod-meet]
    depends_on: [jvb]

  prosody:
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable-11031}
    restart: unless-stopped
    expose: ["5222", "5280"]
    environment: *common
    volumes:
      - prosody-config:/config
      - prosody-plugins:/prosody-plugins-custom
    networks:
      meet:
        aliases: [xmpp.meet.jitsi]

  jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable-11031}
    restart: unless-stopped
    environment: *common
    volumes:
      - jicofo-config:/config
    networks: [meet]
    depends_on: [prosody]

  jvb:
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable-11031}
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    environment: *common
    volumes:
      - jvb-config:/config
    networks: [meet]
    depends_on: [prosody]

volumes:
  web-config:
  prosody-config:
  prosody-plugins:
  jicofo-config:
  jvb-config:

networks:
  meet: {}
  shared_edge:
    external: true
    name: ${SHARED_NGINX_NETWORK:-eyita_edge}
