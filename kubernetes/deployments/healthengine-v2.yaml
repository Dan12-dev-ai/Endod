apiVersion: apps/v1
kind: Deployment
metadata:
  name: dedan-healthengine-v2
  namespace: dedan-health
  labels:
    app: dedan-healthengine-v2
    version: "2.0.0"
    component: "ai-triage"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dedan-healthengine-v2
  template:
    metadata:
      labels:
        app: dedan-healthengine-v2
        version: "2.0.0"
        component: "ai-triage"
    spec:
      containers:
      - name: healthengine-v2
        image: dedan/healthengine:v2.0.0
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: dedan-secrets
              key: OPENAI_API_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dedan-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: dedan-secrets
              key: REDIS_URL
        # Phone sign-up codes. Required: without it production answers every
        # code request with 503 rather than pretending to send.
        - name: SMSETHIOPIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: dedan-secrets
              key: SMSETHIOPIA_API_KEY
        - name: CHROMA_DB_PATH
          value: "/data/clinical_guidelines_db"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENVIRONMENT
          value: "production"
        - name: MAX_TOKENS
          value: "4000"
        - name: TEMPERATURE
          value: "0.3"
        - name: ENABLE_MEMORY
          value: "false"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dedan-healthengine-v2-service
  namespace: dedan-health
  labels:
    app: dedan-healthengine-v2
spec:
  selector:
    app: dedan-healthengine-v2
  ports:
  - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dedan-healthengine-v2-hpa
  namespace: dedan-health
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dedan-healthengine-v2
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dedan-healthengine-config
  namespace: dedan-health
data:
  agent_config.yaml: |
    triage_agent:
      enabled: true
      temperature: 0.3
      max_tokens: 1000
      safety_rules:
        chest_pain_breathing: true
        loss_of_consciousness: true
        severe_bleeding: true
        seizure: true
    safety_guard_agent:
      enabled: true
      temperature: 0.1
      max_tokens: 800
      emergency_keywords_file: "/config/emergency_keywords.json"
    guideline_agent:
      enabled: true
      temperature: 0.3
      max_tokens: 1200
      local_guidelines_path: "/data/clinical_guidelines"
      languages: ["en", "sw", "am", "es", "fr"]
    risk_prediction_agent:
      enabled: true
      temperature: 0.2
      max_tokens: 1000
      model_path: "/models/risk_prediction"
      chronic_conditions: ["diabetes", "hypertension", "asthma", "hiv", "heart_disease"]
    coordinator_agent:
      enabled: true
      temperature: 0.3
      max_tokens: 1500
      safety_first: true
      max_concurrent_agents: 4
  monitoring.yaml: |
    prometheus:
      enabled: true
      port: 9090
      path: /metrics
    jaeger:
      enabled: true
      endpoint: http://jaeger-collector:14268/api/traces
    logging:
      level: info
      format: json
      output: stdout
---
apiVersion: v1
kind: Secret
metadata:
  name: dedan-secrets
  namespace: dedan-health
type: Opaque
data:
  # These should be populated with actual secrets
  # OPENAI_API_KEY: "your-openai-api-key"
  # DATABASE_URL: "postgresql://user:password@host:5432/dedan"
  # REDIS_URL: "redis://host:6379"
