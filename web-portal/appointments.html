<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="web_dashboard" name="shell-type"/>
  <title>Appointments - DEDAN Health</title>
  <link rel="icon" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}
    ::-webkit-scrollbar{display:none;}
    .no-scrollbar::-webkit-scrollbar{display:none;}
    .no-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
  </style>
  <link href="assets/icons.css" rel="stylesheet"/>
  <link href="assets/tailwind.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">
  <aside id="dedan-sidebar" aria-label="Main navigation"
       class="dedan-sidebar fixed left-0 top-0 z-50 h-screen w-sidebar -translate-x-full
              lg:translate-x-0 bg-surface-container-low flex flex-col
              justify-between py-space-md shadow-lg transition-transform
              duration-300">
      <div id="dedan-sidebar-mount" class="flex flex-col min-h-0 flex-1"></div>
    </aside>
    <div id="dedan-nav-overlay" aria-hidden="true"
         class="hidden fixed inset-0 z-40 bg-primary/60 lg:hidden"></div>
  <div id="dedan-content" class=" lg:pl-sidebar ">
    <header class="sticky top-0 z-30 h-header bg-surface-container-low
               border-b border-outline-variant/30 px-space-md lg:px-space-xl
               flex items-center gap-space-sm shadow-panel">
        <button type="button" data-dedan="nav-toggle"
                    aria-expanded="false" aria-controls="dedan-sidebar"
                    aria-label="Open navigation"
                    class="lg:hidden -ml-1 p-2 rounded-lg text-on-surface-variant
                           hover:bg-surface-container focus-visible:outline-none
                           focus-visible:ring-2 focus-visible:ring-secondary">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">menu</span>
        </button>
      <div class="flex items-center gap-space-sm">
        <h1 class="font-headline-md text-headline-md text-primary font-semibold">Appointments</h1>
        <span class="hidden md:inline font-body-sm text-body-sm text-on-surface-variant">Book and manage your consultations</span>
      </div>
      <div class="flex items-center gap-space-md shrink-0">

        <!-- Removed: a Notifications / Settings control with no handler and no

             backing endpoint. Dead controls read as broken features. -->


        <!-- Removed: a Notifications / Settings control with no handler and no

             backing endpoint. Dead controls read as broken features. -->

        <div class="w-px h-6 bg-outline-variant/30"></div>
        <div class="flex items-center gap-space-sm pl-space-sm">
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm shrink-0">
            <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
          </div>
          <div class="flex flex-col text-left">
            <span class="font-label-md text-label-md font-semibold text-on-surface leading-tight" data-dedan="display-name">Daniel Vance</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant leading-tight" data-dedan="dedan-id">DE482731</span>
          </div>
        </div>
        <button type="button" data-dedan="logout" class="p-space-xs text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded-lg transition-all duration-200" aria-label="Sign out">
          <span class="material-symbols-outlined text-[18px]">logout</span>
        </button>
      </div>
    </header>
    <main class="w-full pt-6 pb-space-xl bg-surface min-h-[calc(100vh-4rem)]">
      <div class="w-full max-w-[1200px] mx-auto px-space-md lg:px-space-xl">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-space-md mb-space-xl">
          <div class="space-y-1">
            <h1 class="font-headline-lg text-headline-lg text-primary font-bold tracking-tight">Appointments</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Book and manage your consultations</p>
          </div>
        </div>
        <div id="appointments-summary" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-space-xl"></div>
        <div id="appointment-filters" class="flex gap-space-sm mb-space-xl"></div>
        <div id="appointments-list" class="space-y-space-sm"></div>
        <div id="reschedule-panel" class="hidden pt-space-xl border-t border-outline-variant/30">
          <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-space-xl">
            <h2 class="font-headline-md text-headline-md text-primary font-semibold mb-space-md">Reschedule Appointment</h2>
            <form id="reschedule-form">
              <p data-form-error role="alert" class="hidden rounded-lg bg-error-container text-on-error-container px-3 py-2 font-body-sm text-body-sm"></p>
              <input type="hidden" id="reschedule-id"/>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
                <div>
                  <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">New date and time</label>
                  <input id="reschedule-when" type="datetime-local" class="mt-1 w-full bg-surface-container-lowest text-on-surface rounded-lg shadow-sm px-3 py-2 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary"/>
                </div>
              </div>
              <div class="flex gap-space-sm mt-space-md">
                <button type="submit" class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-secondary text-on-secondary px-4 py-2 font-label-lg text-label-lg hover:opacity-90 transition-opacity">Move appointment</button>
                <button type="button" id="reschedule-cancel" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-outline-variant/50 px-4 py-2 font-label-lg text-label-lg text-on-surface hover:bg-surface-container transition-colors">Cancel</button>
              </div>
            </form>
          </div>
        </div>
        <div class="pt-space-xl border-t border-outline-variant/30">
          <h2 class="font-headline-md text-headline-md text-primary font-semibold mb-space-sm">Book a new appointment</h2>
          <p class="font-body-sm text-body-sm text-on-surface-variant mb-space-md">Schedule a 30-minute consultation with a DEDAN clinician.</p>
          <form id="booking-form" class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
            <p data-form-error role="alert" class="hidden rounded-lg bg-error-container text-on-error-container px-3 py-2 font-body-sm text-body-sm md:col-span-2"></p>
            <div>
              <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">Date and time</label>
              <input id="book-when" type="datetime-local" class="mt-1 w-full bg-surface-container-lowest text-on-surface rounded-lg shadow-sm px-3 py-2 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary" required/>
            </div>
            <div>
              <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">Type</label>
              <select id="book-type" class="mt-1 w-full bg-surface-container-lowest text-on-surface rounded-lg shadow-sm px-3 py-2 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary">
                <option value="consultation">Consultation</option>
                <option value="follow_up">Follow-up</option>
              </select>
            </div>
            <div>
              <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">Modality</label>
              <select id="book-modality" class="mt-1 w-full bg-surface-container-lowest text-on-surface rounded-lg shadow-sm px-3 py-2 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary">
                <option value="in-person">In person</option>
                <option value="telehealth">Telehealth</option>
              </select>
            </div>
            <div>
              <label class="font-label-sm text-label-sm uppercase tracking-writer text-on-surface-variant font-semibold">Reason</label>
              <textarea id="book-reason" rows="3" class="mt-1 w-full bg-surface-container-lowest text-on-surface rounded-lg shadow-sm px-3 py-2 font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-secondary" placeholder="What is this visit for?" required></textarea>
            </div>
            <div>
              <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">Location</label>
              <input id="book-location" type="text" class="mt-1 w-full bg-surface-container-lowest text-on-surface rounded-lg shadow-sm px-3 py-2 font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-secondary" placeholder="Clinic or address"/>
            </div>
            <div>
              <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">Meeting URL</label>
              <input id="book-url" type="url" class="mt-1 w-full bg-surface-container-lowest text-on-surface rounded-lg shadow-sm px-3 py-2 font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-secondary" placeholder="https://meet.example.com/room"/>
            </div>
            <div class="md:col-span-2 flex justify-end">
              <button type="submit" class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-secondary text-on-secondary px-4 py-2 font-label-lg text-label-lg hover:opacity-90 transition-opacity disabled:opacity-60">Book appointment</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/icons.js"></script>
<script src="assets/api.js"></script>
  <script src="assets/nav.js"></script>
<script src="assets/shell.js"></script>
  <script src="assets/hospitals.js"></script>
</body>
</html>
